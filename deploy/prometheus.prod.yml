global:
  scrape_interval: 15s

scrape_configs:
  - job_name: queueforge-api
    static_configs:
      - targets: ["api:9090"]

  # Docker's DNS returns one A record per worker replica, so every replica is scraped.
  - job_name: queueforge-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
