global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "queueforge-api"
    static_configs:
      - targets: ["api:9090"]

  # one A record per worker replica
  - job_name: "queueforge-worker"
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
