# Unit tests for the most important rules in deploy/alerts.yml: the ones your failure drills depend on
# ("stop every worker", "jobs stuck", error spikes). Run with:
#   docker run --rm -v ${PWD}/deploy:/d --entrypoint promtool prom/prometheus:v2.55.1 test rules /d/tests/alerts-queue.test.yml
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # ---------- QueueForgeJobsStuck: a due job has waited 120s (over 60s) for 5 minutes ----------
  - interval: 1m
    input_series:
      - series: 'queueforge_oldest_runnable_job_age_seconds{queue="default",instance="api:9090",job="queueforge-api"}'
        values: '120+0x30'
    alert_rule_test:
      - {eval_time: 3m, alertname: QueueForgeJobsStuck, exp_alerts: []}
      - eval_time: 10m
        alertname: QueueForgeJobsStuck
        exp_alerts:
          - exp_labels:
              severity: page
              queue: default
            exp_annotations:
              summary: "Queue default: a due job has waited 2m 0s"
              runbook: docs/runbooks/runbook-a.md

  # a brief stall that clears before the 5 minute "for" window must not page anyone
  - interval: 1m
    input_series:
      - series: 'queueforge_oldest_runnable_job_age_seconds{queue="default",instance="api:9090",job="queueforge-api"}'
        values: '120+0x3 0+0x30'
    alert_rule_test:
      - {eval_time: 10m, alertname: QueueForgeJobsStuck, exp_alerts: []}

  # ---------- QueueForgeNoLiveWorkers: this is the "stop all workers for 10 minutes" drill ----------
  - interval: 1m
    input_series:
      - series: 'queueforge_workers_alive{instance="api:9090",job="queueforge-api"}'
        values: '2+0x4 0+0x30' # two workers, then all stop heartbeating at minute 5
    alert_rule_test:
      - {eval_time: 4m, alertname: QueueForgeNoLiveWorkers, exp_alerts: []} # workers still alive
      - {eval_time: 6m, alertname: QueueForgeNoLiveWorkers, exp_alerts: []} # zero for under 2 minutes: pending only
      - eval_time: 10m
        alertname: QueueForgeNoLiveWorkers
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "No worker has sent a heartbeat for over a minute"
              runbook: docs/runbooks/runbook-a.md

  # ---------- QueueForgeRetentionFallingBehind: 150000 expired jobs waiting for 1 hour ----------
  - interval: 1m
    input_series:
      - series: 'queueforge_retention_backlog_jobs{instance="api:9090",job="queueforge-api"}'
        values: '150000+0x180'
    alert_rule_test:
      - {eval_time: 30m, alertname: QueueForgeRetentionFallingBehind, exp_alerts: []}
      - eval_time: 90m
        alertname: QueueForgeRetentionFallingBehind
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "150000+ expired jobs are waiting to be deleted: retention is not keeping up and the table is growing"
              runbook: docs/runbooks/runbook-d.md

  # ---------- QueueForgeStatsRefreshFailing: the statistics query keeps failing ----------
  - interval: 1m
    input_series:
      - series: 'queueforge_stats_refresh_errors_total{instance="api:9090",job="queueforge-api"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m # about 10 errors in 10 minutes (over 3), and this rule has no "for" delay
        alertname: QueueForgeStatsRefreshFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              instance: "api:9090"
              job: queueforge-api
            exp_annotations:
              summary: "Queue statistics cannot be read from the database; queue alerts may be stale"
              runbook: docs/runbooks/runbook-d.md
  - interval: 1m
    input_series:
      - series: 'queueforge_stats_refresh_errors_total{instance="api:9090",job="queueforge-api"}'
        values: '0+0x40' # counter never moves
    alert_rule_test:
      - {eval_time: 20m, alertname: QueueForgeStatsRefreshFailing, exp_alerts: []}

  # ---------- QueueForgeDBPoolSaturated: half of all connection acquisitions have to wait ----------
  - interval: 1m
    input_series:
      - series: 'queueforge_db_pool_empty_acquires_total{instance="api:9090",job="queueforge-api"}'
        values: '0+3000x40'
      - series: 'queueforge_db_pool_acquires_total{instance="api:9090",job="queueforge-api"}'
        values: '0+6000x40'
    alert_rule_test:
      - {eval_time: 5m, alertname: QueueForgeDBPoolSaturated, exp_alerts: []}
      - eval_time: 25m
        alertname: QueueForgeDBPoolSaturated
        exp_alerts:
          - exp_labels:
              severity: ticket
              instance: "api:9090"
              job: queueforge-api
            exp_annotations:
              summary: "More than 20% of connection acquisitions have to wait: the pool is saturated"
              runbook: docs/runbooks/runbook-a.md

  # ---------- QueueForgeAPIErrors: about 5% of requests fail with 5xx (over 2%) for 10 minutes ----------
  - interval: 1m
    input_series:
      - series: 'queueforge_api_requests_total{status_class="5xx",instance="api:9090",job="queueforge-api"}'
        values: '0+300x40'   # 5 per second
      - series: 'queueforge_api_requests_total{status_class="2xx",instance="api:9090",job="queueforge-api"}'
        values: '0+6000x40'  # 100 per second
    alert_rule_test:
      - {eval_time: 5m, alertname: QueueForgeAPIErrors, exp_alerts: []}
      - eval_time: 25m
        alertname: QueueForgeAPIErrors
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "More than 2% of API requests are failing with 5xx"
              runbook: docs/runbooks/runbook-d.md
  # a healthy API (no 5xx at all) stays quiet
  - interval: 1m
    input_series:
      - series: 'queueforge_api_requests_total{status_class="5xx",instance="api:9090",job="queueforge-api"}'
        values: '0+0x40'
      - series: 'queueforge_api_requests_total{status_class="2xx",instance="api:9090",job="queueforge-api"}'
        values: '0+6000x40'
    alert_rule_test:
      - {eval_time: 25m, alertname: QueueForgeAPIErrors, exp_alerts: []}
